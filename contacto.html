<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto - Los FOO </title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
  <header>
    <h1>Los FOO </h1>
    <p>Contáctanos para más información</p>
  </header>

  <div class="container">
    <h2>Formulario de Contacto</h2>
    <form action="mailto:correo@empresa.com" method="post" enctype="text/plain">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="email">Correo Electrónico:</label>
      <input type="email" id="email" name="email" required>

      <label for="asunto">Asunto:</label>
      <input type="text" id="asunto" name="asunto" required>

      <label for="mensaje">Mensaje:</label>
      <textarea id="mensaje" name="mensaje" rows="6" required></textarea>

      <button type="submit">Enviar Mensaje</button>
    </form>
  </div>

  <footer>
    <p>&copy; 2025 Los FOO. Todos los derechos reservados.</p>
    <div class="social-links">
      <a href="https://www.facebook.com/LosFOO" target="_blank"><i class="fab fa-facebook"></i> Facebook</a> |
      <a href="https://www.twitter.com/LosFOO" target="_blank"><i class="fab fa-twitter"></i> Twitter</a> |
      <a href="https://www.instagram.com/LosFOO" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
    </div>
  </footer>
</body>
